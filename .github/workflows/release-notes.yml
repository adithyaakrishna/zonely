name: Release Notes

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to update
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update, for example v1.0.0
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-notes-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  update-release-notes:
    name: Generate categorized release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Validate release
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic release tag: $RELEASE_TAG" >&2
            exit 2
          fi

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease

      - name: Generate release notes
        run: |
          response_file="$RUNNER_TEMP/generated-release-notes.json"
          generated_file="$RUNNER_TEMP/generated-release-notes.md"
          notes_file="$RUNNER_TEMP/release-notes.md"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="main" \
            -f configuration_file_path=".github/release.yml" \
            > "$response_file"

          jq -er '.body' "$response_file" > "$generated_file"

          {
            printf '## Download\n\n'
            printf 'Download the signed and notarized universal DMG below, then drag **Zonely** to **Applications**. '
            printf 'SHA-256 checksum files are provided for both the DMG and ZIP archives.\n\n'
            cat "$generated_file"
          } > "$notes_file"

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zonely $RELEASE_TAG" \
            --notes-file "$notes_file"

      - name: Show updated release
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,url,isDraft,isPrerelease
